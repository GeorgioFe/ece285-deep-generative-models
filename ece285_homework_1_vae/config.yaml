
# --------------------------------------------------
# Dataset
# --------------------------------------------------
data_dir: data/chest_xray
image_size: 128
val_fraction: 0.15

# --------------------------------------------------
# Model
# --------------------------------------------------
latent_dim: 128

# --------------------------------------------------
# Training
# --------------------------------------------------
epochs: 50
batch_size: 32
learning_rate: 0.001
beta: 1.0

# --------------------------------------------------
# Reproducibility
# --------------------------------------------------
seed: 42
num_workers: 0

# --------------------------------------------------
# Hardware
# --------------------------------------------------
device: auto

# --------------------------------------------------
# Outputs
# --------------------------------------------------
output_dir: outputs/baseline
sample_every: 5

# --------------------------------------------------
# Evaluation
# --------------------------------------------------
eval_batch_size: 16
